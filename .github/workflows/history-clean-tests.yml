name: AgentClean tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Test Go web app
        run: go test ./...
      - name: Check browser script
        run: node --check public/app.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install git-filter-repo
        run: python -m pip install git-filter-repo
      - name: Test attribution cleanup CLI
        run: python -m unittest discover -s tests -p 'test_history_clean.py' -v
